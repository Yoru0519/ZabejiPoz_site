{% extends "base.html" %}

{% block title %}Галерея{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="section-title">
            <h2>Галерея</h2>
        </div>
        
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="{{ url_for('static', filename='images/roma_guitar.png') }}" alt="Электрогитара Ромы">
            </div>
            <div class="gallery-item">
                <img src="{{ url_for('static', filename='images/kira_guitar.jpg') }}" alt="Электрогитары Киры">
            </div>
            <div class="gallery-item">
                <img src="{{ url_for('static', filename='images/bass.jpg') }}" alt="Басс Ильи">
            </div>
            <div class="gallery-item">
                <img src="{{ url_for('static', filename='images/art_1year.jpg') }}" alt="Арт в честь дня рождения">
            </div>
            <div class="gallery-item">
                <img src="{{ url_for('static', filename='images/first_photo.jpg') }}" alt="Первое фото всей группы">
            </div>
            <div class="gallery-item">
                <img src="{{ url_for('static', filename='images/cool_photo.jpg') }}" alt="Наше общее фото">
            </div>
        </div>
        
        <h3 style="margin-top: 50px;">Наше оборудование</h3>
        <div class="equipment-list">
            {% for member, gear in group.equipment.items() %}
            <div class="equipment-item" style="margin-bottom: 30px;">
                <h4>{{ member }}</h4>
                <ul>
                    {% for item in gear %}
                    <li>{{ item }}</li>
                    {% endfor %}
                </ul>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}

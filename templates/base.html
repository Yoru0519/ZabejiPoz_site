<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
    @supports (-webkit-touch-callout: none) {
        header {
            position: sticky;
            top: 0;
        }
    }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2f3542">
    
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <title>{{ group.name }} - {% block title %}{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <h1>{{ group.name }}</h1>
                <p>{{ group.genre }}</p>
            </div>
            <nav>
                <ul>
                    <li><a href="{{ url_for('index') }}">Главная</a></li>
                    <li><a href="{{ url_for('about') }}">О группе</a></li>
                    <li><a href="{{ url_for('music') }}">Музыка</a></li>
                    <li><a href="{{ url_for('gallery') }}">Галерея</a></li>
                    <li><a href="{{ url_for('news') }}">Новости</a></li>
                    <li><a href="{{ url_for('quiz') }}">Тест</a></li>
                </ul>
            </nav>
            <div class="social-icons">
                <a href="{{ group.socials.telegram }}" target="_blank"><i class="fab fa-telegram"></i></a>
                <a href="{{ group.socials.youtube }}" target="_blank"><i class="fab fa-youtube"></i></a>
                <a href="{{ group.socials.vk }}" target="_blank"><i class="fab fa-vk"></i></a>
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 {{ group.name }}. Все права защищены.</p>
            <div class="footer-links">
                <a href="{{ url_for('privacy_policy') }}">Политика конфиденциальности</a>
                <a href="{{ url_for('contacts') }}">Контакты</a>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script src="{{ url_for('static', filename='js/audio-control.js') }}"></script>
    <script>
        // Динамическая регулировка высоты шапки
        function adjustHeader() {
            const header = document.querySelector('header');
            const main = document.querySelector('main');
            
            if (window.innerWidth <= 768) {
                const headerHeight = header.offsetHeight;
                main.style.marginTop = headerHeight + 'px';
            } else {
                main.style.marginTop = '';
            }
        }
        
        // Вызываем при загрузке и изменении размера
        window.addEventListener('load', adjustHeader);
        window.addEventListener('resize', adjustHeader);
        </script>
    <script>
        // Фикс для мобильной навигации
        document.addEventListener('DOMContentLoaded', function() {
            const nav = document.querySelector('nav ul');
            const links = document.querySelectorAll('nav ul li a');
            
            function adjustNav() {
                if (window.innerWidth <= 768) {
                    // Добавляем индикатор прокрутки
                    nav.style.background = `
                        linear-gradient(to right, 
                        rgba(47, 53, 66, 1) 0%, 
                        rgba(47, 53, 66, 0.9) 10%, 
                        rgba(47, 53, 66, 0) 50%, 
                        rgba(47, 53, 66, 0.9) 90%, 
                        rgba(47, 53, 66, 1) 100%
                    `;
                    
                    // Активная ссылка
                    links.forEach(link => {
                        if (link.href === window.location.href.split('#')[0]) {
                            link.style.backgroundColor = 'var(--primary-color)';
                            link.style.color = 'white';
                        }
                    });
                } else {
                    nav.style.background = 'none';
                }
            }
            
            window.addEventListener('load', adjustNav);
            window.addEventListener('resize', adjustNav);
        });
        </script>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                // Подсветка активной вкладки
                const currentPage = location.pathname.split('/')[1] || 'index';
                const navLinks = document.querySelectorAll('nav ul li a');
                
                navLinks.forEach(link => {
                    const linkPage = link.getAttribute('href').split('/')[1] || 'index';
                    if (currentPage === linkPage) {
                        link.classList.add('active');
                    }
                });
                
                // Прокрутка к активной вкладке на мобильных
                if (window.innerWidth <= 768) {
                    const activeTab = document.querySelector('nav ul li a.active');
                    if (activeTab) {
                        activeTab.scrollIntoView({
                            behavior: 'smooth',
                            block: 'nearest',
                            inline: 'center'
                        });
                    }
                }
            });
            </script>
</body>
</html>
